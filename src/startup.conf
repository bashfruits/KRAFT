description "kraft startup"
author "kraft"
start on stopped pre-startup
script
  C=/dev/console
  cat /etc/issue > $C 2>/dev/null || echo "  KRAFT" > $C
  echo "[kraft] board:  $(crossystem hwid 2>/dev/null | awk '{print $1}')" > $C
  echo "[kraft] kernel: $(uname -r)" > $C
  echo "[kraft] kernver: $(crossystem tpm_kernver 2>/dev/null)" > $C
  echo "[kraft] cpu:    $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | sed 's/^ *//')" > $C
  echo "[kraft] ram:    $(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)MB" > $C
  modprobe usb-storage 2>/dev/null || true
  sleep 1
  ## check we are actually running on chromeos before handing off to factory_install
  ## crossystem is a chromeos-only binary; if it's missing or /etc/lsb-release has no
  ## CHROMEOS_ keys then we are on a non-chromeos environment and factory_install would
  ## crash or do nothing useful.
  IS_CROS=0
  if command -v crossystem >/dev/null 2>&1; then
    if grep -q "^CHROMEOS_" /etc/lsb-release 2>/dev/null; then
      IS_CROS=1
    fi
  fi
  if [ "$IS_CROS" -ne 1 ]; then
    echo "" > $C
    echo "  [!] KRAFT: this does not appear to be a ChromeOS environment." > $C
    echo "      crossystem or /etc/lsb-release CHROMEOS_ keys missing." > $C
    echo "      factory_install.sh will NOT be launched." > $C
    echo "      Dropping to emergency shell — type 'exit' when done." > $C
    echo "" > $C
    exec /bin/bash
  fi
  exec /usr/sbin/factory_install.sh
end script
